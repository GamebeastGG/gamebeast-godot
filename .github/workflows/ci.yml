name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - run: gdformat --check --line-length 100 addons tests demo
      - run: gdlint addons tests demo

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.3 is the minimum supported version.
        godot: ["4.3-stable", "4.4.1-stable", "4.5.1-stable", "4.6-stable"]
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot ${{ matrix.godot }}
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${{ matrix.godot }}/Godot_v${{ matrix.godot }}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${{ matrix.godot }}_linux.x86_64" godot
      - name: Import project
        # Builds the global class cache; the first import exits non-zero on some versions.
        run: timeout 300 ./godot --headless --path . --import || true
      - name: Run tests
        run: timeout 300 ./godot --headless --path . -s tests/run_tests.gd
      - name: Load the editor plugin
        run: |
          timeout 300 ./godot --headless --editor --path . --quit-after 120 2>&1 | tee editor.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" editor.log

  web-export:
    # Makes sure the addon compiles in a Web (JavaScriptBridge) export.
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -sf /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --import || true
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee export.log
          test -f build/web/index.pck
          ! grep -E "SCRIPT ERROR|Parse Error" export.log
